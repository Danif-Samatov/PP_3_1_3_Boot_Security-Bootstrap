<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="fragments/header :: assets"></th:block>
    <title>Login page</title>
</head>
<body class="login-page">
<form class="form-signin" th:action="@{/login}" method="post">
    <h1>Please sign in</h1>
    <div class="alert alert-danger" role="alert" th:if="${param.error}">Invalid email or password</div>
    <div class="alert alert-success" role="alert" th:if="${param.logout}">You have been logged out</div>
    <label for="inputEmail" class="sr-only">Email address</label>
    <input type="email" id="inputEmail" name="username" class="form-control" placeholder="Email address" required autofocus>
    <label for="inputPassword" class="sr-only">Password</label>
    <input type="password" id="inputPassword" name="password" class="form-control" placeholder="Password" required>
    <button class="btn btn-lg btn-primary btn-block" type="submit">Sign in</button>
</form>
</body>
</html>
